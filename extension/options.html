<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>copyclean options</title>
    <style>
      body { font: 13px/1.5 system-ui, sans-serif; margin: 20px; max-width: 420px; }
      label { display: block; margin: 8px 0; }
      #status { color: #0a7; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <h1>copyclean</h1>
    <label><input id="stripFragment" type="checkbox" /> Remove the #fragment when copying</label>
    <label><input id="removeRef" type="checkbox" /> Remove a bare <code>ref</code> parameter</label>
    <button id="save" type="button">Save</button>
    <div id="status" role="status"></div>
    <script type="module" src="options.js"></script>
  </body>
</html>
